<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#166534"/>
      <stop offset="100%" stop-color="#052e16"/>
    </linearGradient>
    <linearGradient id="sh" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="white" stop-opacity="0.14"/>
      <stop offset="55%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- App background -->
  <rect width="48" height="48" rx="11" fill="url(#bg)"/>
  <!-- Top-left shine -->
  <rect width="48" height="26" rx="11" fill="url(#sh)"/>
  <!-- Border -->
  <rect width="48" height="48" rx="11" fill="none" stroke="white" stroke-width="0.5" stroke-opacity="0.12"/>
  <!-- > arrow prompt -->
  <polyline points="9,17 18,24 9,31"
    fill="none" stroke="#4ade80" stroke-width="3"
    stroke-linecap="round" stroke-linejoin="round"
    filter="url(#glow)"/>
  <!-- _ cursor -->
  <line x1="22" y1="31" x2="39" y2="31"
    stroke="#4ade80" stroke-width="2.5"
    stroke-linecap="round"
    filter="url(#glow)"/>
</svg>
