      <stop offset="0%" stop-color="#d29922"/>
      <stop offset="100%" stop-color="#a67b1a"/>
    </linearGradient>
    <linearGradient id="sh" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="white" stop-opacity="0.16"/>
      <stop offset="55%" stop-color="white" stop-opacity="0"/>
