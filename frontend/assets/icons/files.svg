<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="sh" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="white" stop-opacity="0.14"/>
      <stop offset="55%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="48" height="48" rx="11" fill="url(#bg)"/>
  <rect width="48" height="26" rx="11" fill="url(#sh)"/>
  <rect width="48" height="48" rx="11" fill="none" stroke="white" stroke-width="0.5" stroke-opacity="0.12"/>
  <!-- Folder tab -->
  <path d="M8,19 L8,17 Q8,15 10,15 L20,15 L22,13 L38,13 Q40,13 40,15 L40,19 Z"
    fill="white" opacity="0.35"/>
  <!-- Folder body -->
  <path d="M8,19 L40,19 L40,34 Q40,36 38,36 L10,36 Q8,36 8,34 Z"
    fill="none" stroke="white" stroke-width="2.2" stroke-linejoin="round"
    filter="url(#glow)"/>
  <path d="M8,19 L8,17 Q8,15 10,15 L20,15 L22,13 L38,13 Q40,13 40,15 L40,19"
    fill="none" stroke="white" stroke-width="2.2" stroke-linejoin="round"
    filter="url(#glow)"/>
  <!-- Doc lines inside folder -->
  <line x1="15" y1="25" x2="33" y2="25" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="15" y1="30" x2="27" y2="30" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
</svg>
