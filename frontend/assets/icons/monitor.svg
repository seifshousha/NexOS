<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="sh" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="white" stop-opacity="0.14"/>
      <stop offset="55%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="chartFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="white" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="white" stop-opacity="0.04"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="chartClip">
      <rect x="7" y="10" width="34" height="28"/>
    </clipPath>
  </defs>
  <rect width="48" height="48" rx="11" fill="url(#bg)"/>
  <rect width="48" height="26" rx="11" fill="url(#sh)"/>
  <rect width="48" height="48" rx="11" fill="none" stroke="white" stroke-width="0.5" stroke-opacity="0.12"/>
  <!-- Chart area fill -->
  <polygon points="7,38 13,28 20,32 28,16 35,22 41,14 41,38"
    fill="url(#chartFill)" clip-path="url(#chartClip)"/>
  <!-- Chart line -->
  <polyline points="7,38 13,28 20,32 28,16 35,22 41,14"
    fill="none" stroke="white" stroke-width="2.5"
    stroke-linecap="round" stroke-linejoin="round"
    filter="url(#glow)"/>
  <!-- Axis -->
  <line x1="7" y1="38" x2="41" y2="38" stroke="white" stroke-width="1.2" stroke-opacity="0.4"/>
  <!-- Dots on data points -->
  <circle cx="13" cy="28" r="2" fill="white" opacity="0.8"/>
  <circle cx="28" cy="16" r="2" fill="white" opacity="0.8"/>
  <circle cx="41" cy="14" r="2" fill="white" opacity="0.9"/>
</svg>
