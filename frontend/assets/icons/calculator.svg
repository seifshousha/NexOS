<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#7c2d12"/>
    </linearGradient>
    <linearGradient id="sh" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="white" stop-opacity="0.14"/>
      <stop offset="55%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="48" height="48" rx="11" fill="url(#bg)"/>
  <rect width="48" height="26" rx="11" fill="url(#sh)"/>
  <rect width="48" height="48" rx="11" fill="none" stroke="white" stroke-width="0.5" stroke-opacity="0.12"/>
  <!-- Calc body -->
  <rect x="9" y="9" width="30" height="30" rx="4"
    fill="none" stroke="white" stroke-width="2" filter="url(#glow)"/>
  <!-- Display -->
  <rect x="12" y="12" width="24" height="7" rx="2"
    fill="white" opacity="0.25"/>
  <!-- = sign in display -->
  <line x1="19" y1="14.5" x2="29" y2="14.5" stroke="white" stroke-width="1.3" stroke-linecap="round" opacity="0.8"/>
  <line x1="19" y1="17" x2="29" y2="17" stroke="white" stroke-width="1.3" stroke-linecap="round" opacity="0.8"/>
  <!-- Button grid 3×3 -->
  <!-- Row 1 -->
  <rect x="12" y="22" width="6" height="5" rx="1.5" fill="white" opacity="0.5"/>
  <rect x="21" y="22" width="6" height="5" rx="1.5" fill="white" opacity="0.5"/>
  <rect x="30" y="22" width="6" height="5" rx="1.5" fill="white" opacity="0.5"/>
  <!-- Row 2 -->
  <rect x="12" y="30" width="6" height="5" rx="1.5" fill="white" opacity="0.5"/>
  <rect x="21" y="30" width="6" height="5" rx="1.5" fill="white" opacity="0.5"/>
  <!-- = button (accent) -->
  <rect x="30" y="30" width="6" height="5" rx="1.5" fill="white" opacity="0.9"/>
</svg>
