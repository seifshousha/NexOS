<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e7490"/>
      <stop offset="100%" stop-color="#164e63"/>
    </linearGradient>
    <linearGradient id="sh" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="white" stop-opacity="0.14"/>
      <stop offset="55%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <mask id="hub">
      <rect width="48" height="48" fill="white"/>
      <circle cx="24" cy="24" r="5.5" fill="black"/>
    </mask>
  </defs>
  <rect width="48" height="48" rx="11" fill="url(#bg)"/>
  <rect width="48" height="26" rx="11" fill="url(#sh)"/>
  <rect width="48" height="48" rx="11" fill="none" stroke="white" stroke-width="0.5" stroke-opacity="0.12"/>
  <!-- 8-tooth gear (outer R=16, inner R=11.5 around center 24,24) -->
  <path d="
    M 34.63,19.60 L 39.81,21.50 L 39.81,26.50 L 34.63,28.40
    L 36.94,33.41 L 33.41,36.94 L 28.40,34.63
    L 26.50,39.81 L 21.50,39.81 L 19.60,34.63
    L 14.59,36.94 L 11.06,33.41 L 13.37,28.40
    L 8.19,26.50  L 8.19,21.50  L 13.37,19.60
    L 11.06,14.59 L 14.59,11.06 L 19.60,13.37
    L 21.50,8.19  L 26.50,8.19  L 28.40,13.37
    L 33.41,11.06 L 36.94,14.59 Z"
    fill="white" mask="url(#hub)" opacity="0.9"
    filter="url(#glow)"/>
  <!-- Hub ring -->
  <circle cx="24" cy="24" r="5.5" fill="none" stroke="white" stroke-width="1.8" opacity="0.7"/>
</svg>
