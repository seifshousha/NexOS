<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0c4a6e"/>
    </linearGradient>
    <linearGradient id="sh" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="white" stop-opacity="0.14"/>
      <stop offset="55%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="48" height="48" rx="11" fill="url(#bg)"/>
  <rect width="48" height="26" rx="11" fill="url(#sh)"/>
  <rect width="48" height="48" rx="11" fill="none" stroke="white" stroke-width="0.5" stroke-opacity="0.12"/>
  <!-- Outer circle -->
  <circle cx="24" cy="24" r="15"
    fill="none" stroke="white" stroke-width="2.2"
    filter="url(#glow)"/>
  <!-- i dot -->
  <circle cx="24" cy="16.5" r="2" fill="white"/>
  <!-- i stem -->
  <line x1="24" y1="21" x2="24" y2="33"
    stroke="white" stroke-width="2.8" stroke-linecap="round"
    filter="url(#glow)"/>
  <!-- bottom serif -->
  <line x1="20" y1="33" x2="28" y2="33"
    stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
</svg>
