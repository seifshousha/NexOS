<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="sh" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="white" stop-opacity="0.14"/>
      <stop offset="55%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="48" height="48" rx="11" fill="url(#bg)"/>
  <rect width="48" height="26" rx="11" fill="url(#sh)"/>
  <rect width="48" height="48" rx="11" fill="none" stroke="white" stroke-width="0.5" stroke-opacity="0.12"/>
  <!-- Document with fold -->
  <path d="M11,9 L31,9 L37,15 L37,39 Q37,41 35,41 L13,41 Q11,41 11,39 Z"
    fill="white" opacity="0.15"/>
  <path d="M11,9 L31,9 L37,15 L37,39 Q37,41 35,41 L13,41 Q11,41 11,39 Z"
    fill="none" stroke="white" stroke-width="2.2"
    stroke-linejoin="round" filter="url(#glow)"/>
  <!-- Folded corner -->
  <path d="M31,9 L31,15 L37,15"
    fill="none" stroke="white" stroke-width="2" stroke-linejoin="round" opacity="0.55"/>
  <!-- Text lines -->
  <line x1="16" y1="22" x2="32" y2="22" stroke="white" stroke-width="1.8" stroke-linecap="round" opacity="0.8"/>
  <line x1="16" y1="27" x2="32" y2="27" stroke="white" stroke-width="1.8" stroke-linecap="round" opacity="0.8"/>
  <line x1="16" y1="32" x2="26" y2="32" stroke="white" stroke-width="1.8" stroke-linecap="round" opacity="0.8"/>
</svg>
